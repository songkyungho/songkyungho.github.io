<script>
(function () {
  var P = JSON.parse(document.getElementById('sealed').textContent);
  var KEY = 'fs-review-pw';
  var un = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var keep = {
    get: function () { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) { return null; } },
    set: function (v, tab) {
      try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {}
      try { tab ? sessionStorage.setItem(KEY, tab) : sessionStorage.removeItem(KEY); } catch (e) {}
    }
  };
  async function unseal(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(P.salt), iterations: P.iter, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.iv) }, key, un(P.ct));
    var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html = await new Response(stream).text();
    if (html.indexOf('data-sealed') < 0 && html.indexOf('window.__imgmap') < 0) return html;
    var raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)), s = '';
    for (var i = 0; i < raw.length; i++) s += String.fromCharCode(raw[i]);
    return html.replace('<head>', '<head><script>window.__sk="' + btoa(s) + '";<\/script>');
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    f.hidden = false; go.disabled = true; msg.textContent = '이 브라우저에서는 열 수 없습니다. 최신 크롬·사파리·엣지로 열어 주세요.'; return;
  }
  f.onsubmit = async function (e) {
    e.preventDefault();
    go.disabled = true; msg.textContent = '여는 중…';
    try {
      var html = await unseal(pw.value);
      keep.set(document.getElementById('keep').checked ? pw.value : null, pw.value);
      show(html);
    } catch (err) {
      go.disabled = false; msg.textContent = '암호가 맞지 않습니다.'; pw.select();
    }
  };
  var saved = keep.get();
  if (saved) unseal(saved).then(show, function () { keep.set(null, null); f.hidden = false; pw.focus(); });
  else { f.hidden = false; pw.focus(); }
})();
</script>
