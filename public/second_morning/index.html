<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>두 번째 아침 · 리뷰용</title>
<style>
  :root { --bg: #f6f3ec; --ink: #2a2620; --muted: #7a7166; --line: #d9d2c4; --accent: #7a4b2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --ink: #ece6da; --muted: #9b9284; --line: #3a352e; --accent: #d39a6a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Noto Serif KR", "Apple SD Gothic Neo", serif; padding: 16px; }
  main { width: 100%; max-width: 360px; }
  .eyebrow { font-size: 13px; color: var(--muted); }
  h1 { font-size: 28px; margin: 4px 0 20px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: flex; gap: 14px; align-items: baseline; padding: 14px 2px; color: var(--ink); text-decoration: none; font-size: 18px; }
  a span { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
  a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">리뷰용 원고</div>
  <h1>「두 번째 아침」</h1>
  <ul>
    <li><a href="s01/"><span>S01</span>불편한 원정대<small> · 2026-10-22 21:51 업데이트</small></a></li>
  </ul>
</main>
</body>
</html>
